</style></head><body><main class="wrap"><a href="../index.html" id="back"></a><h1 id="title"></h1><p id="sub"></p><div class="row" id="languages"><button data-lang="hinglish">Hinglish</button><button data-lang="hi">हिंदी</button><button data-lang="en">English</button></div><nav class="row" id="tabs"></nav><div id="content" class="card"></div><section class="card"><h2 id="sources"></h2><p id="scope" class="small"></p><ul class="small"><li><a href="https://ncert.nic.in/textbook/pdf/kech102.pdf">NCERT: Structure of Atom</a></li><li><a href="https://openstax.org/books/chemistry-2e/pages/2-2-evolution-of-atomic-theory">OpenStax: atomic evidence</a></li><li><a href="https://openstax.org/books/chemistry-2e/pages/6-2-the-bohr-model">OpenStax: Bohr model</a></li><li><a href="https://openstax.org/books/chemistry-2e/pages/6-3-development-of-quantum-theory">OpenStax: quantum theory</a></li><li><a href="https://openstax.org/books/chemistry-2e/pages/6-4-electronic-structure-of-atoms-electron-configurations">OpenStax: configurations</a></li></ul></section></main><script>const T={"en": {"title": "Structure of Atom", "sub": "Five small interactive checks. Our own schematics, not textbook figures. Not a complete chapter.", "back": "Back to chapter", "choose": "Language", "tabs": ["1. Scattering", "2. Levels", "3. Spectrum", "4. Orbitals", "5. Filling"], "heads": ["Why did alpha particles turn?", "Energy changes have signs", "A series is more than its first line", "An orbital is not an orbit", "Count electrons, then fill"], "intro": ["Choose how close a positive alpha particle passes to a positive nucleus. This is a qualitative path sketch, not a scaled experiment or scattering-rate simulation.", "Hydrogen only, ideal Bohr approximation. Choose initial and final levels. The drawing spaces levels for readable labels, not in proportion to energy.", "Hydrogen emission: ni > nf. R = 1.097 × 10⁷ m⁻¹. The visible range is treated approximately as 380–750 nm here.", "Choose a shape. These are qualitative 2D sections, not calculated probability-density plots or electron paths. Boundaries are not hard walls.", "Neutral ground-state atoms, Z = 1–30. Each box is one orbital; arrows show spin projection, not physical spinning arrows."], "far": "Far pass", "near": "Near pass", "close": "Very close", "nucleus": "Nucleus (+)", "alpha": "Alpha (+2e)", "path": ["Far away: small deflection, shown as approximately straight.", "Closer: electrostatic repulsion bends the path away from the positive nucleus.", "A sufficiently close encounter can scatter an alpha particle backward. It is repulsion, not a hard-wall collision."], "s1check": "Most particles passed through; very few scattered backward. This supports a small positive nucleus containing nearly all atomic mass. The sketch does not predict experimental fractions.", "initial": "Initial ni", "final": "Final nf", "change": "Atomic change", "photon": "Photon energy", "wavelength": "Wavelength", "still": "Same level: no transition photon in this model.", "emit": "Emission", "absorb": "Absorption", "s2check": "ΔEatom = Efinal − Einitial. Photon energy = |ΔEatom|. Bound energies are negative; photon energy and wavelength are positive. E = 0 is the separated-electron reference.", "series": "Series", "line": "Transition", "region": "Region", "limit": "Series limit", "s3check": "Balmer’s first lines are visible, but its limit is in near UV. “All Balmer lines are visible” is false. Lyman is UV; Paschen is IR. A line’s wavelength is not its intensity.", "orbital": "Orbital", "phase": "Signs/colours show wavefunction phase, not positive and negative electron charge.", "s4notes": ["1s: spherical symmetry; no radial or angular nodes. A section through the sphere looks circular.", "2s: spherical symmetry; one spherical radial node, shown as a dashed circle in section. The two regions have opposite phase.", "2pₓ: two lobes, with the yz nodal plane through the nucleus. There is one angular node and no radial node.", "3dxy: four lobes between the x and y axes; the xz and yz planes are angular nodes. No radial node. Not all d orbitals have this shape."], "s4check": "An orbital is a spatial wavefunction ψ. |ψ|² is probability density, not charge and not the probability in an arbitrary finite volume. Three quantum numbers identify an orbital; at most two electrons occupy it with opposite mₛ.", "atomic": "Atomic number Z", "configuration": "Configuration", "unpaired": "Unpaired electrons", "count": "Electron count", "s5check": "Aufbau: available low energy first. Pauli: at most two per orbital, opposite spins. Hund: degenerate orbitals singly with parallel spins before pairing. Cr/Cu are known ground-state exceptions; the simple mnemonic is not an exact universal energy ordering.", "exception": "Known exception: nearby subshell energies and electron interactions matter.", "ion": "For Fe²⁺, remove Fe’s two 4s electrons first: [Ar] 3d⁶. This neutral-atom slider does not model all ions.", "sources": "Sources and scope", "scope": "Selected checks only. Rounded energies/constant values as shown. No apparatus reconstruction, full derivation or Schrödinger solutions. Existing videos are separate material."}, "hinglish": {"title": "Structure of Atom", "sub": "Paanch chhote interactive checks. Hamare apne schematic diagrams, textbook ki figures nahi. Poora chapter nahi.", "back": "Chapter par wapas", "choose": "Language", "tabs": ["1. Scattering", "2. Levels", "3. Spectrum", "4. Orbitals", "5. Filling"], "heads": ["Alpha particles kyun mude?", "Energy change ka sign dekho", "Series sirf pehli line nahi", "Orbital, orbit nahi hai", "Electrons gino, phir bharo"], "intro": ["Positive alpha particle, positive nucleus ke kitne paas jaata hai? Chuno. Yeh qualitative path sketch hai, scale wala experiment ya scattering-rate simulation nahi.", "Sirf hydrogen, ideal Bohr approximation. Initial aur final level chuno. Labels padhne ke liye levels ki spacing badli hai; energy ke proportion mein nahi.", "Hydrogen emission: ni > nf. R = 1.097 × 10⁷ m⁻¹. Yahan visible range lagbhag 380–750 nm li hai.", "Shape chuno. Yeh qualitative 2D sections hain, calculated probability-density plots ya electron paths nahi. Boundary hard wall nahi.", "Neutral ground-state atoms, Z = 1–30. Har box ek orbital; arrows spin projection batate hain, sachmuch ghoomte teer nahi."], "far": "Door se", "near": "Paas se", "close": "Bahut paas", "nucleus": "Nucleus (+)", "alpha": "Alpha (+2e)", "path": ["Door se: bahut kam mudna, yahan lagbhag seedha dikhaya.", "Paas se: electrostatic repulsion path ko positive nucleus se door modti hai.", "Kaafi paas encounter se alpha particle wapas scatter ho sakta hai. Yeh repulsion hai, hard-wall takkar nahi."], "s1check": "Adhiktar particles nikle, bahut kam wapas aaye. Isse chhota positive nucleus milta hai jisme lagbhag saara mass hai. Sketch experimental fractions predict nahi karta.", "initial": "Shuru ni", "final": "Aakhir nf", "change": "Atom ka change", "photon": "Photon energy", "wavelength": "Wavelength", "still": "Same level: is model mein transition photon nahi.", "emit": "Emission", "absorb": "Absorption", "s2check": "ΔEatom = Efinal − Einitial. Photon energy = |ΔEatom|. Bound energies negative; photon energy aur wavelength positive. E = 0 alag electron ka reference hai.", "series": "Series", "line": "Transition", "region": "Region", "limit": "Series limit", "s3check": "Balmer ki pehli lines visible, par limit near UV mein hai. Har Balmer line visible nahi. Lyman UV, Paschen IR. Line ki wavelength uski intensity nahi.", "orbital": "Orbital", "phase": "Signs/colours wavefunction ka phase hain, electron ka positive/negative charge nahi.", "s4notes": ["1s: spherical symmetry; koi radial ya angular node nahi. Sphere ka section circle dikhta hai.", "2s: spherical symmetry; ek spherical radial node, section mein dashed circle. Dono regions ka phase opposite hai.", "2pₓ: do lobes; nucleus se guzarta yz nodal plane. Ek angular node, zero radial node.", "3dxy: x aur y axes ke beech chaar lobes; xz aur yz planes angular nodes. Zero radial node. Har d orbital ki shape aisi nahi."], "s4check": "Orbital spatial wavefunction ψ hai. |ψ|² probability density hai, charge ya kisi bhi finite volume ki seedhi probability nahi. Teen quantum numbers orbital batate hain; maximum do electrons, opposite mₛ.", "atomic": "Atomic number Z", "configuration": "Configuration", "unpaired": "Unpaired electrons", "count": "Electron count", "s5check": "Aufbau: available low energy pehle. Pauli: ek orbital mein maximum do, opposite spins. Hund: same-energy orbitals pehle singly parallel, phir pairing. Cr/Cu known ground-state exceptions hain; mnemonic exact universal energy order nahi.", "exception": "Known exception: paas-paas subshell energies aur electron interactions matter karti hain.", "ion": "Fe²⁺ ke liye Fe ke do 4s electrons pehle hatao: [Ar] 3d⁶. Neutral-atom slider saare ions model nahi karta.", "sources": "Sources aur scope", "scope": "Sirf selected checks. Energy/constants diye hue rounded hain. Full apparatus, derivation ya Schrödinger solutions nahi. Existing videos alag material hain."}, "hi": {"title": "परमाणु की संरचना", "sub": "पांच छोटे संवादात्मक जांच अभ्यास। हमारे अपने सांकेतिक चित्र, पुस्तक की आकृतियां नहीं। यह पूरा अध्याय नहीं है।", "back": "अध्याय पर वापस", "choose": "भाषा", "tabs": ["1. प्रकीर्णन", "2. ऊर्जा स्तर", "3. स्पेक्ट्रम", "4. कक्षक", "5. विन्यास"], "heads": ["अल्फा कण क्यों मुड़े?", "ऊर्जा परिवर्तन का चिह्न देखें", "श्रेणी केवल पहली रेखा नहीं", "कक्षक, कक्षा नहीं है", "इलेक्ट्रॉन गिनें, फिर भरें"], "intro": ["धनात्मक अल्फा कण धनात्मक नाभिक के कितने पास जाता है? चुनें। यह गुणात्मक पथ चित्र है, पैमाने वाला प्रयोग या प्रकीर्णन दर का अनुकरण नहीं।", "केवल हाइड्रोजन, आदर्श बोर सन्निकटन। आरंभिक और अंतिम स्तर चुनें। स्पष्ट नामों के लिए स्तरों का अंतर बदला है; यह ऊर्जा के अनुपात में नहीं है।", "हाइड्रोजन उत्सर्जन: ni > nf। R = 1.097 × 10⁷ m⁻¹। यहां दृश्य सीमा लगभग 380–750 nm ली है।", "आकार चुनें। ये गुणात्मक द्विविमीय काट हैं, गणना किए प्रायिकता-घनत्व चित्र या इलेक्ट्रॉन पथ नहीं। सीमा कठोर दीवार नहीं है।", "उदासीन मूल-अवस्था परमाणु, Z = 1–30। हर डिब्बा एक कक्षक; तीर चक्रण प्रक्षेप बताते हैं, असल में घूमते तीर नहीं।"], "far": "दूर से", "near": "पास से", "close": "बहुत पास", "nucleus": "नाभिक (+)", "alpha": "अल्फा (+2e)", "path": ["दूर से: बहुत कम मुड़ना, यहां लगभग सीधा दिखाया है।", "पास से: वैद्युत प्रतिकर्षण पथ को धनात्मक नाभिक से दूर मोड़ता है।", "पर्याप्त पास आने पर अल्फा कण पीछे प्रकीर्णित हो सकता है। यह प्रतिकर्षण है, कठोर दीवार से टक्कर नहीं।"], "s1check": "अधिकांश कण निकल गए, बहुत कम लौटे। इससे छोटे धनात्मक नाभिक का आधार मिलता है जिसमें लगभग सारा द्रव्यमान है। चित्र प्रयोग के अंशों का अनुमान नहीं देता।", "initial": "आरंभिक ni", "final": "अंतिम nf", "change": "परमाणु परिवर्तन", "photon": "फोटॉन ऊर्जा", "wavelength": "तरंगदैर्घ्य", "still": "समान स्तर: इस मॉडल में संक्रमण फोटॉन नहीं।", "emit": "उत्सर्जन", "absorb": "अवशोषण", "s2check": "ΔEatom = Efinal − Einitial। फोटॉन ऊर्जा = |ΔEatom|। बद्ध ऊर्जा ऋणात्मक, फोटॉन ऊर्जा और तरंगदैर्घ्य धनात्मक। E = 0 अलग इलेक्ट्रॉन का संदर्भ है।", "series": "श्रेणी", "line": "संक्रमण", "region": "क्षेत्र", "limit": "श्रेणी सीमा", "s3check": "बामर की पहली रेखाएं दृश्य, पर सीमा निकट UV में है। हर बामर रेखा दृश्य नहीं। लाइमन UV, पाश्चन IR। रेखा की तरंगदैर्घ्य उसकी तीव्रता नहीं है।", "orbital": "कक्षक", "phase": "चिह्न/रंग तरंग फलन का कला चिह्न हैं, इलेक्ट्रॉन का धन/ऋण आवेश नहीं।", "s4notes": ["1s: गोलाकार सममिति; कोई त्रिज्यीय या कोणीय नोड नहीं। गोले की काट वृत्त जैसी है।", "2s: गोलाकार सममिति; एक गोलाकार त्रिज्यीय नोड, काट में टूटा वृत्त। दोनों क्षेत्रों के कला चिह्न विपरीत हैं।", "2pₓ: दो पालियां; नाभिक से गुजरता yz नोडीय तल। एक कोणीय नोड, शून्य त्रिज्यीय नोड।", "3dxy: x तथा y अक्षों के बीच चार पालियां; xz तथा yz तल कोणीय नोड हैं। शून्य त्रिज्यीय नोड। हर d कक्षक ऐसा नहीं।"], "s4check": "कक्षक स्थानिक तरंग फलन ψ है। |ψ|² प्रायिकता घनत्व है, आवेश या किसी भी सीमित आयतन की सीधी प्रायिकता नहीं। तीन क्वांटम संख्याएं कक्षक बताती हैं; अधिकतम दो इलेक्ट्रॉन, विपरीत mₛ।", "atomic": "परमाणु क्रमांक Z", "configuration": "विन्यास", "unpaired": "अयुग्मित इलेक्ट्रॉन", "count": "इलेक्ट्रॉन संख्या", "s5check": "आफबाऊ: उपलब्ध निम्न ऊर्जा पहले। पाउली: प्रति कक्षक अधिकतम दो, विपरीत चक्रण। हुंड: समान ऊर्जा कक्षक पहले अकेले समानांतर, फिर युग्मन। Cr/Cu मूल-अवस्था के ज्ञात अपवाद हैं; स्मृति नियम सही सार्वभौमिक ऊर्जा क्रम नहीं।", "exception": "ज्ञात अपवाद: पास-पास उपकोश ऊर्जाएं और इलेक्ट्रॉन अन्योन्यक्रियाएं महत्त्वपूर्ण हैं।", "ion": "Fe²⁺ के लिए Fe के दोनों 4s इलेक्ट्रॉन पहले हटाएं: [Ar] 3d⁶। उदासीन-परमाणु स्लाइडर सभी आयनों का मॉडल नहीं है।", "sources": "स्रोत और सीमा", "scope": "केवल चुने हुए जांच अभ्यास। ऊर्जाएं/नियतांक बताए अनुसार सन्निकट हैं। पूरा उपकरण, व्युत्पत्ति या श्रॉडिंगर हल नहीं। पुराने वीडियो अलग सामग्री हैं।"}};
let lang='hinglish',scene=0,pass=0,ni=3,nf=2,series=2,shape=0,Z=8;
const $=id=>document.getElementById(id),fmt=(x,n=3)=>Number(x.toPrecision(n)).toString();
function svg(body){return `<svg viewBox="0 0 280 270" role="img" aria-label="${T[lang].heads[scene]}">${body}</svg>`}
function text(x,y,v){return `<text x="${x}" y="${y}">${v}</text>`}
function render(){const t=T[lang];document.documentElement.lang=lang==='hi'?'hi':'en';for(const k of ['back','title','sub','sources','scope'])$(k).textContent=t[k];document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('tabs').innerHTML=t.tabs.map((x,i)=>`<button data-scene="${i}" aria-pressed="${i===scene}">${x}</button>`).join('');let body=`<h2>${t.heads[scene]}</h2><p>${t.intro[scene]}</p>`;
if(scene===0){body+=`<div class="row">${['far','near','close'].map((x,i)=>`<button data-pass="${i}" aria-pressed="${i===pass}">${t[x]}</button>`).join('')}</div>`;const paths=['M 18 55 L 255 55','M 18 110 L 130 110 Q 165 100 235 35','M 18 140 L 140 140 Q 178 134 126 88 L 26 45'];body+=svg(`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b6431e"/></marker></defs><circle cx="185" cy="156" r="18" fill="#ffdc77" stroke="#8d6000"/><path d="${paths[pass]}" fill="none" stroke="#b6431e" stroke-width="3" marker-end="url(#arrow)"/>${text(115,207,t.nucleus)}${text(15,246,t.alpha)}`)+`<p class="read">${t.path[pass]}</p><p class="check">${t.s1check}</p>`}
if(scene===1){body+=`<div class="row"><label>${t.initial} <select id="ni">${[1,2,3,4].map(n=>`<option ${n===ni?'selected':''}>${n}</option>`).join('')}</select></label><label>${t.final} <select id="nf">${[1,2,3,4].map(n=>`<option ${n===nf?'selected':''}>${n}</option>`).join('')}</select></label></div>`;let g='';for(let n=1;n<=4;n++){const y=230-(n-1)*57;g+=`<line x1="18" y1="${y}" x2="160" y2="${y}" stroke="#5a7da8"/>`+text(166,y+5,`n=${n}`)+text(18,y-12,fmt(-13.6/n**2)+' eV')};g+=`<line x1="126" y1="${230-(ni-1)*57}" x2="126" y2="${230-(nf-1)*57}" stroke="#b6431e" stroke-width="4"/><circle cx="126" cy="${230-(nf-1)*57}" r="6" fill="#b6431e"/>`;body+=svg(g);const d=-13.6/nf**2+13.6/ni**2;body+=`<div class="read">${ni===nf?t.still:`${d<0?t.emit:t.absorb}<br>${t.change}: ${d>0?'+':''}${fmt(d)} eV<br>${t.photon}: ${fmt(Math.abs(d))} eV<br>${t.wavelength}: ${Math.round(1240/Math.abs(d))} nm`}</div><p class="check">${t.s2check}</p>`}
if(scene===2){body+=`<label>${t.series} <select id="series">${['Lyman','Balmer','Paschen'].map((v,i)=>`<option value="${i+1}" ${series===i+1?'selected':''}>${v} (nf=${i+1})</option>`).join('')}</select></label><table><thead><tr><th>${t.line}</th><th>λ / nm</th><th>${t.region}</th></tr></thead><tbody>`;for(let n=series+1;n<=series+4;n++){const l=1e9/(1.097e7*(1/series**2-1/n**2));body+=`<tr><td>${n} → ${series}</td><td>${Math.round(l)}</td><td>${l<380?'UV':l<=750?(lang==='hi'?'दृश्य':lang==='en'?'Visible':'Visible'):'IR'}</td></tr>`};body+=`<tr><td>∞ → ${series}<br>${t.limit}</td><td>${fmt(1e9*series**2/1.097e7)}</td><td>${series===3?'IR':'UV'}</td></tr></tbody></table><p class="check">${t.s3check}</p>`}
if(scene===3){body+=`<label>${t.orbital} <select id="shape">${['1s','2s','2pₓ','3dxy'].map((v,i)=>`<option value="${i}" ${shape===i?'selected':''}>${v}</option>`).join('')}</select></label>`;let g='';const c=['#c2e6ff','#f5c7df'];if(shape<2){g+=`<circle cx="140" cy="130" r="85" fill="${c[0]}" stroke="#245a8c"/>`;if(shape===1)g+=`<circle cx="140" cy="130" r="37" fill="${c[1]}" stroke="#9e345f" stroke-dasharray="5 4"/>`;g+=text(120,150,shape===1?'−':'+')+text(194,135,'+')}else if(shape===2){g+=`<ellipse cx="85" cy="130" rx="53" ry="40" fill="${c[0]}"/><ellipse cx="195" cy="130" rx="53" ry="40" fill="${c[1]}"/><line x1="140" y1="35" x2="140" y2="225" stroke="#6d7690" stroke-dasharray="4 4"/>`+text(80,135,'+')+text(190,135,'−')}else{for(let i=0;i<4;i++){const x=i%2?190:90,y=i<2?80:180;g+=`<ellipse cx="${x}" cy="${y}" rx="35" ry="35" fill="${c[(i===0||i===3)?0:1]}"/>`+text(x-5,y+5,(i===0||i===3)?'+':'−')};g+=`<path d="M 140 25 V 235 M 25 130 H 255" stroke="#6d7690" stroke-dasharray="4 4"/>`+text(248,121,'x')+text(149,30,'y')};g+=`<circle cx="140" cy="130" r="3" fill="#173758"/>`+text(18,253,t.nucleus);body+=svg(g)+`<p class="read">${t.s4notes[shape]}</p><p>${t.phase}</p><p class="check">${t.s4check}</p>`}
if(scene===4){const orb=[['1s',1],['2s',1],['2p',3],['3s',1],['3p',3],['4s',1],['3d',5]];let left=Z,occ=orb.map(([a,n])=>{let k=Math.min(left,n*2);left-=k;return k});if(Z===24){occ[5]=1;occ[6]=5}if(Z===29){occ[5]=1;occ[6]=10}let unpaired=0;body+=`<label>${t.atomic}: <b>${Z}</b><input type="range" id="z" min="1" max="30" step="1" value="${Z}"></label>`;orb.forEach(([name,n],i)=>{if(!occ[i])return;body+=`<div class="orbrow"><span class="orbname">${name}</span>`;for(let k=0;k<n;k++){let e=(occ[i]>k?1:0)+(occ[i]>n+k?1:0);if(e===1)unpaired++;body+=`<span class="box">${e===2?'↑↓':e===1?'↑':''}</span>`}body+='</div>'});body+=`<div class="read">${t.configuration}: ${orb.map(([a,n],i)=>occ[i]?a+'<sup>'+occ[i]+'</sup>':'').filter(Boolean).join(' ')}<br>${t.count}: ${occ.reduce((a,b)=>a+b,0)}<br>${t.unpaired}: ${unpaired}</div>${Z===24||Z===29?`<p>${t.exception}</p>`:''}<p class="check">${t.s5check}</p><p>${t.ion}</p>`}
$('content').innerHTML=body;
for(const id of ['ni','nf','series','shape','z'])if($(id))$(id).onchange=e=>{const v=Number(e.target.value);if(id==='ni')ni=v;if(id==='nf')nf=v;if(id==='series')series=v;if(id==='shape')shape=v;if(id==='z')Z=v;render()};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang)lang=b.dataset.lang;if(b.dataset.scene!==undefined)scene=Number(b.dataset.scene);if(b.dataset.pass!==undefined)pass=Number(b.dataset.pass);render()});render();
</script></body></html>
